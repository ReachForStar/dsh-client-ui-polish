packages:
  - packages/*

# The suite targets the official 0.2.2-rc.1 pre-release line. Its transitive
# ranges point at sibling pre-releases that npm's `next` tag carries, so the
# workspace pins the shared low-level packages to the same build.
overrides:
  '@deepseek-ai/dsh-sandbox': 0.2.2-rc.1
  '@deepseek-ai/dsh-sandbox-policy': 0.2.2-rc.1
  '@deepseek-ai/dsh-shell': 0.2.2-rc.1
  '@deepseek-ai/dsh-output-retention': 0.2.2-rc.1
  '@deepseek-ai/dsh-client-ui-theme': 0.2.2-rc.1

# pnpm 11 ignores dependency build scripts unless allowlisted; these are on
# the suite's dependency chain and need their postinstall steps (native
# bindings / binary download / generated code) in a fresh CI install.
# NOTE: pnpm 11 spells this as the `allowBuilds` DICT (`pkg: true`), not the
# pnpm 10 `onlyBuiltDependencies` list — the list form is silently ignored.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  cpu-features: true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true
  ssh2: true

# The 0.2.2-rc.1 pre-releases are newer than pnpm's default minimum release
# age, and this workspace exists to consume them.
minimumReleaseAge: 0
